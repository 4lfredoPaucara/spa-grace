<div class="fixed inset-0 z-50 flex items-start justify-center pt-10">
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="close.emit()"></div>
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-6 border-b">
      <h2 class="text-xl font-semibold text-spa-dark">{{ empleado() ? 'Editar' : 'Nuevo' }} Empleado</h2>
      <button class="text-gray-400 hover:text-gray-600" (click)="close.emit()"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <h3 class="font-semibold text-sm text-gray-500 uppercase">Datos de Usuario</h3>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label><input type="text" class="input-spa" formControlName="nombre" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email *</label><input type="email" class="input-spa" formControlName="email" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Username *</label><input type="text" class="input-spa" formControlName="username" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label><input type="text" class="input-spa" formControlName="telefono" /></div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña {{ empleado() ? '' : '*' }}</label>
          <input type="password" class="input-spa" formControlName="password" [placeholder]="empleado() ? 'Dejar vacío para mantener' : ''" />
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Rol *</label>
          <select class="input-spa" formControlName="rol"><option value="terapeuta">Terapeuta</option><option value="recepcionista">Recepcionista</option></select>
        </div>
      </div>

      <h3 class="font-semibold text-sm text-gray-500 uppercase pt-2">Datos Laborales</h3>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Especialidad</label><select class="input-spa" formControlName="idEspecialidad"><option [value]="0">Seleccionar</option></select></div>
        <div class="flex items-center gap-2 pt-6"><input type="checkbox" formControlName="activo" class="rounded" /><label class="text-sm text-gray-700">Activo</label></div>
      </div>

      <h3 class="font-semibold text-sm text-gray-500 uppercase pt-2">Servicios Autorizados</h3>
      <div class="max-h-64 overflow-y-auto border rounded-lg p-4 space-y-4">
        @for (grupo of serviciosPorCategoria(); track grupo.categoria.id) {
          <div>
            <p class="text-sm font-medium text-gray-600 mb-2">{{ grupo.categoria.nombre }}</p>
            <div class="grid grid-cols-2 gap-1">
              @for (s of grupo.servicios; track s.id) {
                <label class="flex items-center gap-2 text-sm text-gray-700 py-1 cursor-pointer hover:bg-gray-50 px-2 rounded">
                  <input type="checkbox" [checked]="selectedServicios().has(s.id)" (change)="toggleServicio(s.id)" class="rounded" />
                  {{ s.nombre }}
                </label>
              }
            </div>
          </div>
        }
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t">
        <button type="button" class="btn-spa-secondary" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn-spa-primary" [disabled]="isSubmitting() || form.invalid">{{ isSubmitting() ? 'Guardando...' : 'Guardar' }}</button>
      </div>
    </form>
  </div>
</div>
