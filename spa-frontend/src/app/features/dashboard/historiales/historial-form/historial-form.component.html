<div class="fixed inset-0 z-50 flex items-start justify-center pt-10">
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="close.emit()"></div>
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-6 border-b">
      <h2 class="text-xl font-semibold text-spa-dark">{{ historial() ? 'Editar' : 'Nuevo' }} Registro</h2>
      <button class="text-gray-400 hover:text-gray-600" (click)="close.emit()"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">ID Cliente *</label><input type="number" class="input-spa" formControlName="idCliente" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">ID Turno</label><input type="number" class="input-spa" formControlName="idTurno" /></div>
      </div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label><input type="date" class="input-spa" formControlName="fecha" /></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Diagnóstico</label><textarea class="input-spa" rows="3" formControlName="diagnostico"></textarea></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Tratamiento</label><textarea class="input-spa" rows="3" formControlName="tratamiento"></textarea></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Notas</label><textarea class="input-spa" rows="2" formControlName="notas"></textarea></div>
      <div class="flex justify-end gap-3 pt-3 border-t">
        <button type="button" class="btn-spa-secondary" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn-spa-primary" [disabled]="isSubmitting() || form.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
