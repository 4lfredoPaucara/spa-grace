<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-spa-primary/5 via-spa-light to-spa-secondary/5 p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-gradient-to-br from-spa-primary to-spa-secondary text-white text-2xl font-bold shadow-lg shadow-spa-primary/25 mb-4">
        SG
      </div>
      <h1 class="text-2xl font-bold text-spa-dark tracking-tight">SpaGrace</h1>
      <p class="text-sm text-gray-500 mt-1">Sistema de Gestión</p>
    </div>

    <div class="spa-card p-8 shadow-xl shadow-gray-200/50 bg-white rounded-2xl">
      <h2 class="text-lg font-semibold text-spa-dark mb-1">Iniciar Sesión</h2>
      <p class="text-sm text-gray-400 mb-6">Ingresá tus credenciales para acceder</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        @if (errorMessage()) {
          <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm border border-red-200 flex items-center gap-2">
            <svg class="h-4 w-4 shrink-0" style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <!-- Campo Usuario -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Usuario</label>
          <div class="relative flex items-center">
            <div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-gray-400">
              <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </div>
            <input
              type="text"
              formControlName="username"
              class="input-spa !pl-11"
              placeholder="Tu nombre de usuario"
              autocomplete="username"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
          <div class="relative flex items-center">
            <div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-gray-400">
              <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <input
              type="password"
              formControlName="password"
              class="input-spa !pl-11"
              placeholder="Tu contraseña"
              autocomplete="current-password"
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn-spa-primary w-full py-3 text-base font-semibold flex items-center justify-center gap-2 cursor-pointer"
          [disabled]="loginForm.invalid || isLoading()"
        >
          @if (isLoading()) {
            <svg class="animate-spin h-5 w-5" style="width: 1.25rem; height: 1.25rem;" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <span>Ingresando...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      SpaGrace v2.0 &mdash; Gestión Integral de Spa
    </p>
  </div>
</div>
